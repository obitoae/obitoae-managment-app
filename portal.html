<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portal de cliente — Obitoae Management</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1b1b1a">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obitoae">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* El portal no usa la barra lateral de la app principal — layout simple. */
  .portal-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    background: var(--dark, #1b1b1a);
    color: #fff;
  }
  .portal-topbar .brand {
    font-family: "Bebas Neue", sans-serif;
    letter-spacing: 0.5px;
    font-size: 22px;
  }
  .portal-main {
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .portal-loading {
    padding: 60px 20px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="portal-loading" class="portal-loading">Cargando…</div>

<div id="portal-app" hidden>
  <div class="portal-topbar">
    <div class="brand">Obitoae Management</div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span id="portal-nombre" class="muted" style="color:#fff;"></span>
      <button id="portal-logout-btn" class="btn-logout">Cerrar sesión</button>
    </div>
  </div>

  <main class="portal-main">
    <header class="view-header">
      <h2 id="portal-saludo">Bienvenido</h2>
      <p class="muted">Aquí puedes ver tus servicios y el avance de tus tareas.</p>
    </header>

    <div class="panel">
      <h3>Tus servicios</h3>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Fecha</th><th>Servicio</th><th>Tipo</th><th>Monto</th><th>Forma de pago</th><th>Facturado</th></tr></thead>
          <tbody id="portal-tabla-ingresos"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h3>Tus tareas</h3>
      <div id="portal-tareas" class="stat-list"></div>
    </div>
  </main>
</div>

<script type="module" src="portal.js"></script>
</body>
</html>
